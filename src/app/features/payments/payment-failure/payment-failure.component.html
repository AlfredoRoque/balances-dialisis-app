<section class="status-shell failure">
  <article class="status-card">
    <mat-icon class="status-icon">report_gmailerrorred</mat-icon>
    <p class="eyebrow">Pago rechazado</p>
    <h1>El pago no se completó</h1>
    <p class="message">
      No recibimos la confirmación del cobro. Verifica tu método de pago o vuelve a intentarlo desde el panel para
      mantener activo el monitoreo de tus pacientes.
    </p>
    <button mat-flat-button color="primary" type="button" (click)="goHome()">
      <span>OK</span>
    </button>
  </article>
</section>
