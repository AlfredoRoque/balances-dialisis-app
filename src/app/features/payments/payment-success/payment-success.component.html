<section class="status-shell success">
  <article class="status-card">
    <mat-icon class="status-icon">check_circle</mat-icon>
    <p class="eyebrow">Pago confirmado</p>
    <h1>¡Tu suscripción está activa!</h1>
    <p class="message">
      Registramos el pago correctamente y tus módulos fueron habilitados. Puedes continuar monitoreando a tus pacientes
      desde el panel principal.
    </p>
    <button mat-flat-button color="primary" type="button" (click)="goHome()">
      <span>OK</span>
    </button>
  </article>
</section>
